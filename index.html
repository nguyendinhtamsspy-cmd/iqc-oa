<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IQC OA – SamJin LND Vina</title>
<meta name="description" content="IQC SMART – Hệ thống kiểm soát chất lượng đầu vào SamJin LND Vina">
<meta name="theme-color" content="#0b1f3f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<!-- iPhone / iPad -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IQC OA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/apple-120.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1f3f;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
/* Chừa vùng tai thỏ / thanh trạng thái của iPhone */
.top{position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:#0b1f3f;z-index:3}
#app{position:fixed;left:0;right:0;top:env(safe-area-inset-top);bottom:0;width:100%;height:calc(100% - env(safe-area-inset-top));border:0;background:#fff;display:block}
#splash{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;
  background:radial-gradient(120% 80% at 85% 0%,#2f7fe0 0%,#14457f 40%,#0b1f3f 100%);transition:opacity .35s}
#splash.hide{opacity:0;pointer-events:none}
#splash img{width:112px;height:112px;border-radius:26px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
#splash h1{margin:6px 0 0;font-size:22px;letter-spacing:.04em}
#splash p{margin:0;font-size:13px;color:#cfe4ff;letter-spacing:.18em}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#4da3ff;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
#msg{max-width:300px;text-align:center;font-size:14px;line-height:1.5;color:#e6f0ff;display:none}
.btns{display:none;gap:10px;flex-wrap:wrap;justify-content:center}
.btns a,.btns button{font:inherit;font-size:15px;font-weight:600;padding:11px 18px;border-radius:12px;border:0;background:#0a7cff;color:#fff;text-decoration:none;cursor:pointer}
.btns .g{background:rgba(255,255,255,.14)}
</style>
</head>
<body>
<div class="top"></div>
<div id="splash">
  <img src="icons/apple-180.png" alt="IQC OA">
  <h1>IQC OA</h1><p>SAMJIN LND VINA</p>
  <div class="spin" id="spin"></div>
  <div id="msg"></div>
  <div class="btns" id="btns"><button type="button" onclick="reloadApp()">↻ Tải lại</button><a class="g" id="direct" target="_blank" rel="noopener">Mở bằng Safari / Chrome</a></div>
</div>
<iframe id="app" title="IQC SMART" allow="camera; microphone; clipboard-read; clipboard-write; fullscreen; geolocation" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
/* Địa chỉ App IQC SMART (Apps Script /exec). Đổi link ở đây nếu triển khai lại với link mới. */
var APP_URL='https://script.google.com/macros/s/AKfycbyyU7SmiLzCY7lwM-9qCvfCJA1upXZtB0IqXUJ68I-iMztZgHA2LIAXonKSUQepxFM2/exec?ui=v31';
var frame=document.getElementById('app'),splash=document.getElementById('splash'),msg=document.getElementById('msg'),btns=document.getElementById('btns'),spin=document.getElementById('spin'),timer;
document.getElementById('direct').href=APP_URL;
function show(t){spin.style.display='none';msg.style.display='block';msg.innerHTML=t;btns.style.display='flex';splash.classList.remove('hide');}
function reloadApp(){
  if(!navigator.onLine){show('Điện thoại đang <b>mất mạng</b>.<br>Kết nối Wi-Fi hoặc 4G rồi bấm Tải lại.');return;}
  ready=false;msg.style.display='none';btns.style.display='none';spin.style.display='block';splash.classList.remove('hide');
  clearTimeout(timer);timer=setTimeout(function(){show('App đang tải lâu hơn bình thường.<br>Bấm <b>Tải lại</b>, hoặc mở bằng trình duyệt.');},25000);
  frame.src=APP_URL+'&t='+Date.now();
}
/* App IQC báo "đã sẵn sàng" bằng postMessage; nếu khung tải xong mà không có tín hiệu → App chưa cho phép mở trong khung hoặc lỗi */
var ready=false;
window.addEventListener('message',function(e){if(e.data&&e.data.iqc==='ready'&&/(googleusercontent\.com|google\.com)$/.test(new URL(e.origin).hostname)){ready=true;clearTimeout(timer);setTimeout(function(){splash.classList.add('hide');},300);}});
frame.addEventListener('load',function(){if(ready)return;clearTimeout(timer);timer=setTimeout(function(){if(!ready)show('Không mở được App trong khung ứng dụng.<br>Bấm <b>Tải lại</b>; nếu vẫn lỗi, bấm <b>Mở bằng trình duyệt</b> và báo Admin.');},9000);});
window.addEventListener('offline',function(){show('Mất kết nối mạng. Dữ liệu đang nhập dở <b>chưa được lưu</b> – đừng tắt App, chờ có mạng rồi bấm Lưu lại.');});
window.addEventListener('online',function(){if(!splash.classList.contains('hide'))reloadApp();});
reloadApp();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
</body>
</html>

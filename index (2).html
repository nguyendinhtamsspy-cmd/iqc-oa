<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IQC OA – SamJin LND Vina</title>
<meta name="description" content="IQC SMART – Hệ thống kiểm soát chất lượng đầu vào SamJin LND Vina">
<meta name="theme-color" content="#0b1f3f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<!-- iPhone / iPad -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IQC OA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/apple-120.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1f3f;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
/* Chừa vùng tai thỏ / thanh trạng thái của iPhone */
.top{position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:#0b1f3f;z-index:3}
#app{position:fixed;left:0;right:0;top:env(safe-area-inset-top);bottom:0;width:100%;height:calc(100% - env(safe-area-inset-top));border:0;background:#fff;display:block}
#splash{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;
  background:radial-gradient(120% 80% at 85% 0%,#2f7fe0 0%,#14457f 40%,#0b1f3f 100%);transition:opacity .35s}
#splash.hide{opacity:0;pointer-events:none}
#splash img{width:112px;height:112px;border-radius:26px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
#splash h1{margin:6px 0 0;font-size:22px;letter-spacing:.04em}
#splash p{margin:0;font-size:13px;color:#cfe4ff;letter-spacing:.18em}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#4da3ff;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
#msg{max-width:300px;text-align:center;font-size:14px;line-height:1.5;color:#e6f0ff;display:none}
.btns{display:none;gap:10px;flex-wrap:wrap;justify-content:center}
.btns a,.btns button{font:inherit;font-size:15px;font-weight:600;padding:11px 18px;border-radius:12px;border:0;background:#0a7cff;color:#fff;text-decoration:none;cursor:pointer}
.btns .g{background:rgba(255,255,255,.14)}
#inst{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:9;display:none;background:#fff;color:#18283b;border-radius:16px;padding:14px 16px 14px 14px;box-shadow:0 14px 40px rgba(0,0,0,.35);font-size:14.5px;line-height:1.45;gap:12px;align-items:center}
#inst img{width:46px;height:46px;border-radius:11px;flex:none}#inst b{color:#0a63c9}#inst .x{position:absolute;right:8px;top:4px;border:0;background:none;font-size:20px;color:#8a97a8;cursor:pointer}
#inst button.go{margin-top:8px;border:0;background:#0a7cff;color:#fff;font:inherit;font-weight:700;padding:9px 16px;border-radius:10px;cursor:pointer}
#inst .arrow{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(-2px + env(safe-area-inset-bottom));width:0;height:0;border:10px solid transparent;border-top-color:#fff}
</style>
</head>
<body>
<div class="top"></div>
<div id="splash">
  <img src="icons/apple-180.png" alt="IQC OA">
  <h1>IQC OA</h1><p>SAMJIN LND VINA</p>
  <div class="spin" id="spin"></div>
  <div id="msg"></div>
  <div class="btns" id="btns"><button type="button" onclick="reloadApp()">↻ Tải lại</button><a class="g" id="direct" target="_blank" rel="noopener">Mở bằng Safari / Chrome</a></div>
</div>
<iframe id="app" title="IQC SMART" allow="camera; microphone; clipboard-read; clipboard-write; fullscreen; geolocation" referrerpolicy="no-referrer-when-downgrade"></iframe>
<div id="inst"><button class="x" type="button" onclick="hideInst(1)" aria-label="Đóng">×</button><img src="icons/apple-180.png" alt=""><div id="instTxt"></div></div>
<script>
/* Địa chỉ App IQC SMART (Apps Script /exec). Đổi link ở đây nếu triển khai lại với link mới. */
var APP_URL='https://script.google.com/macros/s/AKfycbyyU7SmiLzCY7lwM-9qCvfCJA1upXZtB0IqXUJ68I-iMztZgHA2LIAXonKSUQepxFM2/exec?ui=v31';
var frame=document.getElementById('app'),splash=document.getElementById('splash'),msg=document.getElementById('msg'),btns=document.getElementById('btns'),spin=document.getElementById('spin'),timer;
document.getElementById('direct').href=APP_URL;
function show(t){spin.style.display='none';msg.style.display='block';msg.innerHTML=t;btns.style.display='flex';splash.classList.remove('hide');}
function reloadApp(){
  if(!navigator.onLine){show('Điện thoại đang <b>mất mạng</b>.<br>Kết nối Wi-Fi hoặc 4G rồi bấm Tải lại.');return;}
  ready=false;waitEnter=false;msg.style.display='none';btns.style.display='none';spin.style.display='block';splash.classList.remove('hide');
  clearTimeout(timer);timer=setTimeout(function(){show('App đang tải lâu hơn bình thường.<br>Bấm <b>Tải lại</b>, hoặc mở bằng trình duyệt.');},25000);
  frame.src=APP_URL+'&t='+Date.now();
}
/* App IQC báo "đã sẵn sàng" bằng postMessage; nếu khung tải xong mà không có tín hiệu → App chưa cho phép mở trong khung hoặc lỗi */
var ready=false;
/* Giữ đăng nhập: App gửi mã phiên (khi tick "Ghi nhớ") → lưu ở bộ nhớ của ứng dụng; lần mở sau gửi trả để vào thẳng */
var TK='iqcOaSession',waitEnter=false;
function okOrigin(o){try{return /\.googleusercontent\.com$/.test(new URL(o).hostname);}catch(x){return false;}}
function hideSplash(){clearTimeout(timer);setTimeout(function(){splash.classList.add('hide');},300);}
window.addEventListener('message',function(e){if(!e.data||!okOrigin(e.origin))return;var m=e.data;
  if(m.iqc==='ready'){var first=!ready;ready=true;var tk='';try{tk=localStorage.getItem(TK)||'';}catch(x){}
    if(tk){e.source.postMessage({iqc:'token',token:tk},e.origin);if(first){waitEnter=true;clearTimeout(timer);timer=setTimeout(function(){waitEnter=false;hideSplash();},6000);}}
    else if(!waitEnter)hideSplash();}
  else if(m.iqc==='entered'){waitEnter=false;hideSplash();}
  else if(m.iqc==='saveToken'&&m.token){try{localStorage.setItem(TK,String(m.token));}catch(x){}}
  else if(m.iqc==='clearToken'){try{localStorage.removeItem(TK);}catch(x){}}
});
frame.addEventListener('load',function(){if(ready)return;clearTimeout(timer);timer=setTimeout(function(){if(!ready)show('Không mở được App trong khung ứng dụng.<br>Bấm <b>Tải lại</b>; nếu vẫn lỗi, bấm <b>Mở bằng trình duyệt</b> và báo Admin.');},9000);});
window.addEventListener('offline',function(){show('Mất kết nối mạng. Dữ liệu đang nhập dở <b>chưa được lưu</b> – đừng tắt App, chờ có mạng rồi bấm Lưu lại.');});
window.addEventListener('online',function(){if(!splash.classList.contains('hide'))reloadApp();});

/* Hướng dẫn / nút CÀI ỨNG DỤNG khi đang mở bằng trình duyệt (chưa cài) */
var standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
var ua=navigator.userAgent,isIOS=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),isSafari=isIOS&&!/CriOS|FxiOS|EdgiOS|Zalo|FBAN|FBAV|Line|Instagram/i.test(ua),inApp=/Zalo|FBAN|FBAV|Line|Instagram/i.test(ua);
var inst=document.getElementById('inst'),instTxt=document.getElementById('instTxt'),deferred=null;
function hideInst(x){inst.style.display='none';if(x)try{sessionStorage.setItem('iqcInstHide','1');}catch(e){}}
function showInst(h){try{if(sessionStorage.getItem('iqcInstHide'))return;}catch(e){}instTxt.innerHTML=h;inst.style.display='flex';}
if(!standalone){
  if(isIOS&&inApp)showInst('<b>Cài App IQC OA:</b> bấm <b>…</b> (góc trên) → <b>Mở bằng trình duyệt / Safari</b>, sau đó làm theo hướng dẫn.');
  else if(isIOS&&!isSafari)showInst('<b>Cài App IQC OA:</b> trên iPhone hãy mở link này bằng <b>Safari</b>.');
  else if(isIOS)showInst('<b>Cài App IQC OA:</b> bấm nút <b>Chia sẻ</b> <svg width="17" height="20" viewBox="0 0 17 20" style="vertical-align:-3px"><path d="M8.5 1v11M4.5 5l4-4 4 4" fill="none" stroke="#0a63c9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 8H2.5v10.5h12V8h-3" fill="none" stroke="#0a63c9" stroke-width="1.8" stroke-linejoin="round"/></svg> ở thanh dưới → kéo xuống chọn <b>“Thêm vào MH chính”</b> → <b>Thêm</b>.<span class="arrow"></span>');
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;showInst('<b>Cài App IQC OA</b> lên máy để mở nhanh, toàn màn hình.<br><button class="go" type="button" id="goInst">⬇ Cài ứng dụng</button>');
    document.getElementById('goInst').onclick=function(){deferred.prompt();deferred.userChoice.then(function(){hideInst(1);deferred=null;});};});
  window.addEventListener('appinstalled',function(){hideInst(1);});
}
reloadApp();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
</body>
</html>
